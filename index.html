<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cloud Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Login Box Styles */
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #444; font-size: 14px; font-weight: 600; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        /* Common Buttons */
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #0056b3; }

        /* Dashboard/Gallery Box Styles (Initially Hidden) */
        #dashboardSection { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #logoutBtn { background-color: #dc3545; width: auto; padding: 8px 15px; font-size: 14px; margin: 0; }
        #logoutBtn:hover { background-color: #c82333; }
        
        .upload-box { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 2px dashed #ccc; }
        input[type="file"] { margin-bottom: 10px; width: 100%; }
        #uploadBtn { background-color: #28a745; }
        #uploadBtn:hover { background-color: #218838; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-height: 300px; overflow-y: auto; }
        .gallery img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .loading-text { text-align: center; color: #666; font-size: 14px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. LOGIN SECTION -->
        <div id="loginSection">
            <h2>Client Login</h2>
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password / PIN</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button type="button" id="loginBtn">Login to Gallery</button>
        </div>

        <!-- 2. DASHBOARD & GALLERY SECTION (Hidden by default) -->
        <div id="dashboardSection">
            <div class="header">
                <h3>My Gallery ☁️</h3>
                <button id="logoutBtn">Logout</button>
            </div>

            <div class="upload-box">
                <input type="file" id="fileInput" accept="image/*">
                <button id="uploadBtn">Upload to Cloud</button>
            </div>

            <div class="gallery" id="galleryContainer">
                <p class="loading-text">Loading photos...</p>
            </div>
        </div>

    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzerH2qOUHW1CFbNegDRwLLrBOKbKkGGw",
            authDomain: "gallery-private-2026.firebaseapp.com",
            projectId: "gallery-private-2026",
            storageBucket: "gallery-private-2026.firebasestorage.app",
            messagingSenderId: "726122424090",
            appId: "1:726122424090:web:0f37ec3b7a1b64b101aea3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);

        let activeUser = null;

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const galleryContainer = document.getElementById('galleryContainer');

        // स्टेट ट्रैक करें
        onAuthStateChanged(auth, (user) => {
            if (user) {
                activeUser = user;
                loginSection.style.display = "none";
                dashboardSection.style.display = "block";
                loadGallery(user.uid);
            } else {
                activeUser = null;
                dashboardSection.style.display = "none";
                loginSection.style.display = "block";
            }
        });

        // डायरेक्ट क्लिक से लॉगिन
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                alert("Please enter email and password!");
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.innerText = "Logging in...";
            loginBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Login Failed: " + error.message);
                loginBtn.innerText = "Login to Gallery";
                loginBtn.disabled = false;
            }
        });

        // फोटो अपलोड लॉजिक
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) { 
                alert("Please select a photo first!"); 
                return; 
            }

            if (!activeUser) { 
                alert("Session not active. Please log in again.");
                return; 
            }

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = "Uploading... ⏳";
            uploadBtn.disabled = true;

            const storageRef = ref(storage, `users/${activeUser.uid}/${file.name}`);
            try {
                await uploadBytes(storageRef, file);
                alert("Photo uploaded successfully! ✅");
                fileInput.value = "";
                loadGallery(activeUser.uid);
            } catch (error) {
                alert("Upload failed: " + error.message);
            } finally {
                uploadBtn.innerText = "Upload to Cloud";
                uploadBtn.disabled = false;
            }
        });

        // गैलरी लोड करने का फंक्शन
        async function loadGallery(uid) {
            galleryContainer.innerHTML = '<p class="loading-text">Fetching photos... ☁️</p>';
            const listRef = ref(storage, `users/${uid}/`);
            try {
                const res = await listAll(listRef);
                galleryContainer.innerHTML = "";
                
                if (res.items.length === 0) {
                    galleryContainer.innerHTML = '<p class="loading-text">No photos uploaded yet. 📸</p>';
                    return;
                }

                res.items.forEach(async (itemRef) => {
                    const url = await getDownloadURL(itemRef);
                    const imgElement = document.createElement('img');
                    imgElement.src = url;
                    galleryContainer.appendChild(imgElement);
                });
            } catch (error) {
                galleryContainer.innerHTML = '<p class="loading-text" style="color:red;">Error loading gallery.</p>';
            }
        }

        // लॉगआउट बटन
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });
    </script>
</body>
</html>
