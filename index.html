<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरी प्राइवेट गैलरी - लॉगिन</title>
    <style>
        /* वेबसाइट का मॉडर्न डिज़ाइन (CSS) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .auth-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .auth-container p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        #loginBtn {
            background-color: #007bff;
        }

        #loginBtn:hover {
            background-color: #0056b3;
        }

        #signupBtn {
            background-color: #28a745;
        }

        #signupBtn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>प्राइवेट गैलरी ☁️</h2>
        <p>अपनी पर्सनल स्टोरेज एक्सेस करने के लिए लॉगिन करें</p>

        <!-- लॉगिन फॉर्म -->
        <input type="text" id="usernameInput" placeholder="अपनी यूज़रनेम ID डालें (जैसे: raman123)" required>
        <input type="password" id="pinInput" placeholder="अपना गुप्त PIN डालें" required>

        <button id="loginBtn">लॉगिन (Login)</button>
        <button id="signupBtn">नया अकाउंट बनाएँ (Sign Up)</button>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 👇 यहाँ आपको अपना Firebase Config पेस्ट करना है 👇
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };
        // 👆 ------------------------------------------- 👆

        // Firebase Initialize करें
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ID को ईमेल में बदलने का फंक्शन (ताकि Firebase एक्सेप्ट कर ले)
        function getEmailFromUsername(username) {
            return username.trim() + "@mygallery.com";
        }

        // नया अकाउंट (Sign Up) लॉजिक
        document.getElementById('signupBtn').addEventListener('click', () => {
            const username = document.getElementById('usernameInput').value;
            const pin = document.getElementById('pinInput').value;

            if(!username || !pin) {
                alert("कृपया ID और PIN दोनों भरें!");
                return;
            }

            const dummyEmail = getEmailFromUsername(username);

            createUserWithEmailAndPassword(auth, dummyEmail, pin)
                .then((userCredential) => {
                    alert("अकाउंट सफलतापूर्वक बन गया! अब आप लॉगिन कर सकते हैं।");
                })
                .catch((error) => {
                    if(error.code === 'auth/email-already-in-use') {
                        alert("यह ID पहले से किसी ने ले रखी है, कोई दूसरी ID चुनें।");
                    } else if (error.code === 'auth/weak-password') {
                        alert("PIN कम से कम 6 अक्षरों/नंबरों का होना चाहिए।");
                    } else {
                        alert("एरर: " + error.message);
                    }
                });
        });

        // लॉगिन (Login) लॉजिक
        document.getElementById('loginBtn').addEventListener('click', () => {
            const username = document.getElementById('usernameInput').value;
            const pin = document.getElementById('pinInput').value;

            if(!username || !pin) {
                alert("कृपया ID और PIN दोनों भरें!");
                return;
            }

            const dummyEmail = getEmailFromUsername(username);

            signInWithEmailAndPassword(auth, dummyEmail, pin)
                .then((userCredential) => {
                    // लॉगिन सफल होने पर यूज़र को मेन गैलरी पेज पर भेज दें
                    window.location.href = "dashboard.html"; // हम अगला पेज dashboard.html बनाएंगे
                })
                .catch((error) => {
                    alert("गलत ID या PIN! कृपया दोबारा चेक करें।");
                });
        });
    </script>
</body>
</html>
