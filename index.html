<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - My Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { background-color: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .auth-container h2 { color: #333; margin-bottom: 5px; }
        .auth-container p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input:focus { outline: none; border-color: #007bff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        #mainActionBtn { background-color: #007bff; }
        #mainActionBtn:hover { background-color: #0056b3; }
        .toggle-text { font-size: 13px; color: #007bff; cursor: pointer; margin-top: 15px; display: block; }
        
        /* Name field hidden initially (only visible during signup) */
        #nameGroup { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="formTitle">Client Login</h2>
        <p id="formSubtitle">Login to view your gallery</p>

        <!-- Client Name (Visible only during Sign Up) -->
        <div class="input-group" id="nameGroup">
            <label>Full Name</label>
            <input type="text" id="nameInput" placeholder="Client's Full Name">
        </div>

        <div class="input-group">
            <label>Email ID</label>
            <input type="email" id="emailInput" placeholder="client@example.com" required>
        </div>

        <div class="input-group">
            <label>Password / PIN</label>
            <input type="password" id="passwordInput" placeholder="Minimum 6 characters" required>
        </div>

        <button id="mainActionBtn">Login</button>
        <span class="toggle-text" id="toggleFormBtn">Want to create a new client account? Click here</span>
    </div>
<!-- Firebase SDK Modules -->
    <script type="module">
        // Importing Firebase version 12.19.0 (as per your screenshot)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // Your actual Firebase Config from the screenshot
        const firebaseConfig = {
            apiKey: "AIzaSyCzerH2qOUHW1CFbNegDRwLLrBOKbKkGGw",
            authDomain: "gallery-private-2026.firebaseapp.com",
            projectId: "gallery-private-2026",
            storageBucket: "gallery-private-2026.firebasestorage.app",
            messagingSenderId: "726122424090",
            appId: "1:726122424090:web:0f37ec3b7a1b64b101aea3",
            measurementId: "G-JCEBG3N2JH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); 

        // UI Toggle Logic (Switch between Login and Signup)
        let isSignupMode = false;
        const nameGroup = document.getElementById('nameGroup');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const mainActionBtn = document.getElementById('mainActionBtn');
        const toggleFormBtn = document.getElementById('toggleFormBtn');

        toggleFormBtn.addEventListener('click', () => {
            isSignupMode = !isSignupMode;
            if (isSignupMode) {
                nameGroup.style.display = "block";
                formTitle.innerText = "Register New Client";
                formSubtitle.innerText = "Create an authentic client account";
                mainActionBtn.innerText = "Sign Up";
                mainActionBtn.style.backgroundColor = "#28a745";
                toggleFormBtn.innerText = "Already have an account? Login";
            } else {
                nameGroup.style.display = "none";
                formTitle.innerText = "Client Login";
                formSubtitle.innerText = "Login to view your gallery";
                mainActionBtn.innerText = "Login";
                mainActionBtn.style.backgroundColor = "#007bff";
                toggleFormBtn.innerText = "Want to create a new client account? Click here";
            }
        });

        // Main Action (Login or Signup)
        mainActionBtn.addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();

            if (!email || !password) {
                alert("Email and password are required!");
                return;
            }

            if (isSignupMode) {
                // --- SIGN UP LOGIC ---
                if (!name) { 
                    alert("Client name is required!"); 
                    return; 
                }
                
                try {
                    mainActionBtn.innerText = "Processing...";
                    // 1. Create account in Firebase Auth
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // 2. Save client details in Firestore Database
                    await setDoc(doc(db, "clients", user.uid), {
                        fullName: name,
                        email: email,
                        role: "client",
                        createdAt: new Date()
                    });

                    alert(`Account created successfully! ${name} can now login.`);
                    // Switch back to login page
                    toggleFormBtn.click(); 
                } catch (error) {
                    alert("Error: " + error.message);
                    mainActionBtn.innerText = "Sign Up";
                }
            } else {
                // --- LOGIN LOGIC ---
                try {
                    mainActionBtn.innerText = "Logging in...";
                    await signInWithEmailAndPassword(auth, email, password);
                    
                    alert("Login successful!");
                    // Redirect to gallery dashboard
                    window.location.href = "dashboard.html";
                } catch (error) {
                    alert("Invalid email or password!");
                    mainActionBtn.innerText = "Login";
                }
            }
        });
    </script>
    </script>
</body>
</html>
